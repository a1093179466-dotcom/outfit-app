<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>穿搭网编辑器</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* 只对这个页面加点更像产品的布局 */
    .graph-wrap { display:flex; gap:12px; height: calc(100vh - 90px); }
    .graph-left { width: 32%; overflow:auto; }
    .graph-right { width: 68%; position: relative; overflow:hidden; }
    .graph-canvas { position: relative; width:100%; height:100%; border:1px dashed #d9dbe3; border-radius:16px; background:#fff; }
    .node {
      position:absolute; width:180px; cursor:move; user-select:none;
      border:1px solid #ececf2; border-radius:14px; padding:10px; background:#fafafa;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    }
    .node.selected { outline: 3px solid rgba(74,105,189,0.45); }
    .node img { width:100%; height:110px; object-fit:cover; border-radius:10px; }
    .node-title { font-weight:700; margin-top:8px; }
    .node-meta { font-size:12px; opacity:0.75; margin-top:4px; }
    svg.edges { position:absolute; inset:0; pointer-events:none; }
    .edge-hit { pointer-events:all; cursor:pointer; }
    .edge-label {
      font-size:12px; fill:#333;
      paint-order: stroke; stroke:#fff; stroke-width:4px;
    }
    .top-actions { display:flex; gap:10px; flex-wrap:wrap; }
  </style>
</head>
<body>
<header>
  <h1>穿搭网编辑器</h1>
</header>

<div class="container">
  <div class="top-actions">
    <a class="link-btn" href="./wardrobe.html">← 返回衣柜详情</a>
    <button id="saveGraphBtn" class="primary-btn" type="button">保存全部规则</button>
    <button id="clearCanvasBtn" class="delete-btn" type="button">清空画布（不删数据库）</button>
    <div class="empty-tip" id="graphTip">拖拽左侧衣服到右侧画布；点击两个节点连线；点击线可切换类型/删除。</div>
  </div>

  <div class="graph-wrap" style="margin-top:12px;">
    <section class="panel graph-left">
      <h2>衣柜</h2>
      <div class="add-form">
        <input id="qName" type="text" placeholder="搜索名称…" />
        <select id="seasonFilter">
          <option value="">全部季节</option>
          <option value="spring">春</option>
          <option value="summer">夏</option>
          <option value="autumn">秋</option>
          <option value="winter">冬</option>
        </select>
        <select id="kindFilter">
          <option value="">全部类别</option>
          <option value="jk_set">JK套装</option>
          <option value="daily_set">日常套装</option>
          <option value="outer">外搭</option>
          <option value="inner">内搭</option>
          <option value="bottom">下装</option>
          <option value="socks">袜子</option>
          <option value="shoes">鞋子</option>
        </select>
      </div>
      <div id="clothList" class="detail-grid"></div>
    </section>

    <section class="panel graph-right">
      <h2>画布</h2>
      <div class="graph-canvas" id="canvas">
        <svg class="edges" id="edgesSvg"></svg>
      </div>
    </section>
  </div>
</div>

<script type="module" src="js/rule_graph.js"></script>
</body>
</html>
